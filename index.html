<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impres3Dione - Artes em 3D</title>
<style>
  :root {
    --preto: #010101;
    --cartao: #0d0d0d;
    --linha: #332a1c;
    --laranja: #c89a3c;
    --laranja-claro: #f0cf75;
    --prata: #c9c9c9;
    --texto: #f2f2f2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--preto);
    color: var(--texto);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    width: 100%;
    text-align: center;
    background: var(--cartao);
    border-radius: 20px;
    padding: 28px 24px 24px;
    border: 1px solid var(--linha);
    box-shadow: 0 0 0 1px rgba(232,121,42,.08), 0 10px 40px rgba(0,0,0,.6);
  }
  .logo { display: block; width: 100%; height: auto; margin-bottom: 18px; }
  .btn {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
    margin-top: 10px;
  }
  .btn-whatsapp {
    border: none;
    background: linear-gradient(180deg, var(--laranja-claro), var(--laranja));
    color: #1a1305;
  }
  .btn-whatsapp:hover { filter: brightness(1.06); }
  .btn-insta {
    border: 1px solid var(--laranja);
    background: transparent;
    color: var(--laranja-claro);
  }
  .btn-insta:hover { background: #1b1607; }
  .btn:focus-visible { outline: 2px solid var(--laranja-claro); outline-offset: 2px; }
</style>
</head>
